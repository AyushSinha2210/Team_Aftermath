# ==============================================================================
# Ariadne Central Configuration
# Theme 01: Agentic Code Intelligence — PRISM GenAI Hackathon
# Single source of truth for paths, model choices, hyperparameters, and thresholds
# ==============================================================================

# Global Settings (Shared)
global:
  seed: 42
  device: "cpu"                  # Default device: CPU-first design for inference
  log_level: "INFO"
  cache_dir: ".cache"

# Base Bi-Encoder Model (Person A owns, everyone depends on)
# Small, CPU-friendly code/text representation model (<35M parameters)
model:
  name: "sentence-transformers/all-MiniLM-L6-v2"
  final_checkpoint: "finetuning/checkpoints/best_biencoder"
  embedder_entrypoint: "ariadne.finetuning.embedder:encode"
  pooling: "mean"
  embedding_dim: 384
  max_seq_length: 512
  normalize_embeddings: true

# Dataset Configuration (CoIR Apps Benchmark)
data:
  dataset_name: "CoIR-Retrieval/apps"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_split: "train"
  valid_split: "valid"
  test_split: "test"
  validation_ratio: 0.1

# ------------------------------------------------------------------------------
# PERSON A: Fine-tuning Configuration
# Contrastive learning loop, loss definition, negative mining, and validation
# ------------------------------------------------------------------------------
finetuning:
  checkpoint_dir: "finetuning/checkpoints"
  best_checkpoint_path: "finetuning/checkpoints/best_biencoder"
  loss: "MultipleNegativesRankingLoss"
  scale: 20.0
  batch_size: 16
  eval_batch_size: 32
  num_epochs: 3
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  evaluation_steps: 100
  early_stopping_patience: 2
  metric_for_early_stopping: "ndcg@10"
  hard_negatives:
    enabled: true
    bm25_num_negatives: 3
    round2_dense_num_negatives: 3
    margin: 0.1

# ------------------------------------------------------------------------------
# PERSON B: Hybrid Retrieval Configuration (Owned by Person B)
# PrePostPipelineEncoder, BM25 sparse index, and Reciprocal Rank Fusion
# ------------------------------------------------------------------------------
retrieval:
  dense_top_k: 50
  sparse_top_k: 50
  rrf_k: 60                      # Reciprocal Rank Fusion smoothing constant
  dense_weight: 0.5
  sparse_weight: 0.5
  bm25_k1: 1.5
  bm25_b: 0.75

# ------------------------------------------------------------------------------
# PERSON C: Reranking & Structural Analysis (Owned by Person C)
# Cross-encoder, confidence calibration, and AST/call-graph analysis
# ------------------------------------------------------------------------------
reranking:
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_top_k: 20
  calibration_threshold: 0.35    # Score variance threshold below which to abstain
  structural:
    ast_enabled: false           # Hands-on phase feature for JS/Python repos
    call_graph_depth: 2

# ------------------------------------------------------------------------------
# PERSON D: Versioning, Evolutionary Retrieval & Demo (Owned by Person D)
# Content hashing, incremental indexing, dedup, and demo server
# ------------------------------------------------------------------------------
versioning:
  hash_algorithm: "sha256"
  dedup_cosine_threshold: 0.95
  incremental_cache_path: "versioning/.index_cache"
  demo:
    host: "0.0.0.0"
    port: 7860
    theme: "dark"
